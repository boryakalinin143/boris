<title>Personal Chef OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: graphite side rail (bottom bar on phones) + cream working surface; restaurant-menu typography, copper hairlines. Single deliberate light look. */
:root{
  color-scheme: light;
  --cream:#F3ECDF; --paper:#FBF8F2; --paper2:#F7F1E6;
  --ink:#24221F; --ink2:#4A4540; --muted:#7D7368;
  --graphite:#232322; --graphite2:#2E2E2C; --on-dark:#EFE7D8; --on-dark-mute:#A79E90;
  --olive:#4F5A2E; --olive-soft:#E4E3CF; --olive-ink:#3D4623;
  --bordeaux:#6F1D2B; --bordeaux-soft:#F1DCDC;
  --copper:#A8683A; --gold:#C3A05A; --gold-soft:#F1E6CC;
  --line:#E2D7C4; --line2:#D3C4AB;
  --warn:#A86A12; --warn-soft:#F6E7C9;
  --display:"Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --body:"Golos Text", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --r:6px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--bordeaux)}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance;color:var(--ink)}
h1{font-size:2.6rem} h2{font-size:1.9rem} h3{font-size:1.45rem} h4{font-size:1.15rem}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--copper);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tiny{font-size:.75rem}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{background:var(--graphite);color:var(--on-dark);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:26px 14px 18px}
.brand{padding:0 10px 22px;border-bottom:1px solid #3a3936;margin-bottom:14px}
.brand .mark{font-family:var(--display);font-size:1.7rem;line-height:1;color:var(--on-dark)}
.brand .mark em{color:var(--gold);font-style:italic}
.brand .sub{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--on-dark-mute);margin-top:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:4px;color:var(--on-dark-mute);font-size:.93rem}
.nav button:hover{color:var(--on-dark);background:var(--graphite2)}
.nav button.on{color:var(--on-dark);background:var(--graphite2);box-shadow:inset 2px 0 0 var(--gold)}
.nav button:focus-visible{outline:2px solid var(--gold)}
.nav .ico{width:18px;height:18px;flex:none;opacity:.9}
.nav .sep{height:1px;background:#3a3936;margin:10px 8px}
.rail-foot{margin-top:auto;padding:14px 10px 0;font-size:.72rem;color:var(--on-dark-mute);line-height:1.45}
.rail-foot b{color:var(--on-dark);font-weight:500}
.main{min-width:0;padding-block:26px 90px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line2);padding-bottom:16px}
.topbar .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.topbar .acts{display:flex;gap:8px;flex-wrap:wrap}
.tabbar{display:none}

/* blocks */
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card.flat{background:transparent;border-style:dashed}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{font-size:1.35rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.hr{height:1px;background:var(--line);border:0;margin:4px 0}

.btn{appearance:none;border:1px solid var(--graphite);background:var(--graphite);color:var(--on-dark);padding:8px 14px;border-radius:4px;cursor:pointer;font-size:.88rem;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;line-height:1.2}
.btn:hover{background:#000}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--ink);background:var(--paper)}
.btn.copper{background:var(--copper);border-color:var(--copper);color:#fff}
.btn.copper:hover{background:#8e562e}
.btn.olive{background:var(--olive);border-color:var(--olive);color:#fff}
.btn.olive:hover{background:var(--olive-ink)}
.btn.wine{background:var(--bordeaux);border-color:var(--bordeaux);color:#fff}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn.xs{padding:3px 8px;font-size:.75rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{all:unset;cursor:pointer;color:var(--bordeaux);font-size:.85rem;text-decoration:underline;text-underline-offset:3px}
.link:focus-visible{outline:2px solid var(--copper)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.75rem;border:1px solid var(--line2);background:var(--paper);color:var(--ink2);white-space:nowrap}
.chip.olive{background:var(--olive-soft);border-color:transparent;color:var(--olive-ink)}
.chip.wine{background:var(--bordeaux-soft);border-color:transparent;color:var(--bordeaux)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.gold{background:var(--gold-soft);border-color:transparent;color:#7a5a1c}
.chip.dark{background:var(--graphite);color:var(--on-dark);border-color:transparent}
button.chip{cursor:pointer}
button.chip.sel{background:var(--olive);color:#fff;border-color:var(--olive)}

input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:#fff;border:1px solid var(--line2);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.8rem;color:var(--muted);min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}

/* plate visual */
.plate{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:4px;overflow:hidden;background:var(--c2,#3b3a33)}
.plate::before{content:"";position:absolute;inset:0;background:
  radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.10), transparent 55%),
  repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 2px, transparent 2px 5px)}
.plate .dish{position:absolute;left:50%;top:52%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 50% 50%, var(--c1,#b67a3f) 0 30%, color-mix(in srgb, var(--c1,#b67a3f) 60%, #f4eee3) 44%, #f6f1e7 47%, #efe8db 66%, #e2d8c6 69%, #f3ede2 71%);
  box-shadow:0 18px 30px rgba(0,0,0,.35)}
.plate .dish::after{content:"";position:absolute;inset:27%;border-radius:50%;background:radial-gradient(circle at 38% 35%, color-mix(in srgb, var(--c3,#7a8a3a) 85%, transparent) 0 9%, transparent 10%),radial-gradient(circle at 64% 58%, color-mix(in srgb, var(--c3,#7a8a3a) 70%, transparent) 0 7%, transparent 8%);filter:blur(1px)}
.plate img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plate .tag{position:absolute;left:10px;bottom:9px;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.82);background:rgba(0,0,0,.32);padding:2px 7px;border-radius:3px}
.plate .cz{position:absolute;right:10px;top:9px;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85)}

/* special */
.special{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--graphite);color:var(--on-dark);border-radius:var(--r);overflow:hidden}
.special .plate{aspect-ratio:auto;min-height:280px;border-radius:0}
.special .plate .dish{width:auto;height:80%}
.special .body{padding:26px 28px;display:flex;flex-direction:column;gap:12px;min-width:0}
.special h2{color:var(--on-dark);font-size:2.3rem;font-style:italic}
.special .eyebrow{color:var(--gold)}
.special .meta{display:flex;gap:18px;flex-wrap:wrap;font-size:.85rem;color:var(--on-dark-mute)}
.special .meta b{display:block;color:var(--on-dark);font-size:1.05rem;font-weight:500}
.special .btn.ghost{color:var(--on-dark);border-color:#55524c}
.special .btn.ghost:hover{background:var(--graphite2)}

/* meals */
.meal{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal .plate{aspect-ratio:1;border-radius:50%}
.meal .plate .dish{width:86%}
.meal .when{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--copper);font-weight:600}
.meal .name{font-family:var(--display);font-size:1.3rem;font-weight:600;line-height:1.15;cursor:pointer}
.meal .name:hover{color:var(--bordeaux)}
.meal .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.done-mark{color:var(--olive);font-weight:600;font-size:.8rem}

/* stats */
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--display);font-size:2rem;font-weight:600;line-height:1}
.stat .l{font-size:.75rem;color:var(--muted);letter-spacing:.04em}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--olive);border-radius:3px}
.bar.copper>i{background:var(--copper)}
.bar.wine>i{background:var(--bordeaux)}
.macro{display:grid;grid-template-columns:86px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:.85rem}
.macro .r{text-align:right}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .ttl{font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--olive)}
.dot.warn{background:var(--warn)} .dot.bad{background:var(--bordeaux)} .dot.mute{background:var(--line2)}

/* week grid */
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.wk-scroll{overflow-x:auto}
.day{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.day.today{border-color:var(--copper);box-shadow:inset 0 3px 0 var(--copper)}
.day h4{font-size:1.2rem}
.slot{border-top:1px dashed var(--line2);padding-top:8px;display:flex;flex-direction:column;gap:3px}
.slot .k{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--copper);font-weight:600;display:flex;justify-content:space-between}
.slot .n{font-family:var(--display);font-size:1.05rem;font-weight:600;line-height:1.15;cursor:pointer}
.slot .n:hover{color:var(--bordeaux)}
.slot .x{display:flex;gap:4px;flex-wrap:wrap}
.slot.empty .n{color:var(--muted);font-style:italic;font-weight:500}

/* recipe cards */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.rcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0}
.rcard:hover{border-color:var(--copper)}
.rcard .plate{border-radius:0}
.rcard .in{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.rcard h4{font-size:1.25rem}
.rcard .m{display:flex;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}

/* table */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.r,table.t th.r{text-align:right}
table.t tr.done td{opacity:.5}
table.t tr.done td .pn{text-decoration:line-through}

/* modal */
.ov{position:fixed;inset:0;background:rgba(25,22,18,.55);display:flex;justify-content:center;align-items:flex-start;z-index:50;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--paper);border-radius:var(--r);width:min(860px,100%);border:1px solid var(--line2);box-shadow:0 30px 70px rgba(0,0,0,.3);margin:auto 0}
.modal.narrow{width:min(520px,100%)}
.modal .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:18px 22px 12px;border-bottom:1px solid var(--line)}
.modal .mb{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:12px 22px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line)}
.x-btn{all:unset;cursor:pointer;font-size:1.4rem;line-height:1;color:var(--muted);padding:2px 6px}
.x-btn:focus-visible{outline:2px solid var(--copper)}

/* recipe detail */
.rd-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px}
.ing{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dotted var(--line2);font-size:.92rem}
.ing .q{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink2)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}
.steps li::before{content:counter(s);font-family:var(--display);font-size:1.4rem;color:var(--copper);font-weight:600;line-height:1.1}
.note{background:var(--gold-soft);border-radius:4px;padding:10px 12px;font-size:.88rem}
.note.wine{background:var(--bordeaux-soft);color:#5a1420}
.note.olive{background:var(--olive-soft);color:var(--olive-ink)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:4px;overflow:hidden}
.stepper button{all:unset;cursor:pointer;padding:4px 10px;font-weight:600}
.stepper span{padding:4px 8px;min-width:28px;text-align:center;border-left:1px solid var(--line2);border-right:1px solid var(--line2)}
.stars{display:inline-flex;gap:2px}
.stars button{all:unset;cursor:pointer;font-size:1.35rem;color:var(--line2);line-height:1}
.stars button.on{color:var(--gold)}
.stars button:focus-visible{outline:2px solid var(--copper)}

/* cooking mode */
.cook{position:fixed;inset:0;background:var(--graphite);color:var(--on-dark);z-index:60;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cook h1,.cook h2,.cook h3{color:var(--on-dark)}
.cook .ch{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #3d3c39;padding-bottom:12px}
.cook .cb{flex:1;overflow-y:auto;padding:24px 0;display:flex;flex-direction:column;gap:18px;max-width:860px;width:100%;margin:0 auto}
.cook .cf{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #3d3c39;padding-top:12px;flex-wrap:wrap}
.cook .big{font-size:1.45rem;line-height:1.5;font-family:var(--body)}
.cook .pill{display:inline-flex;gap:6px;align-items:center;border:1px solid #55524c;border-radius:999px;padding:5px 12px;font-size:.88rem}
.cook .pill.t{border-color:var(--gold);color:var(--gold)}
.cook .cue{border-left:3px solid var(--olive-soft);padding:6px 12px;color:#d8d2c3}
.cook .tip{border-left:3px solid var(--gold);padding:6px 12px;color:#e6d9b8}
.cook .btn.ghost{color:var(--on-dark);border-color:#55524c}
.cook .btn.ghost:hover{background:var(--graphite2)}
.cook .prog{height:3px;background:#3d3c39;border-radius:2px}
.cook .prog i{display:block;height:100%;background:var(--gold)}
.cook .mise label{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #3d3c39;font-size:1.05rem}
.timers{display:flex;gap:8px;flex-wrap:wrap}
.timer{background:var(--graphite2);border:1px solid #4a4844;border-radius:6px;padding:8px 12px;display:flex;gap:10px;align-items:center}
.timer .tv{font-variant-numeric:tabular-nums;font-size:1.3rem;font-weight:600}
.timer.ring{border-color:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{background:#4a3b1f}}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px;max-height:60vh;overflow-y:auto;padding:4px}
.msg{max-width:84%;padding:10px 14px;border-radius:8px;white-space:pre-wrap;font-size:.93rem}
.msg.me{align-self:flex-end;background:var(--graphite);color:var(--on-dark)}
.msg.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--graphite);color:var(--on-dark);padding:10px 16px;border-radius:6px;z-index:80;font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r);font-size:.9rem}
.drop{border:1px dashed var(--line2);border-radius:var(--r);padding:16px;text-align:center;color:var(--muted);font-size:.88rem}
.skill{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lv{display:flex;gap:3px}
.lv button{all:unset;cursor:pointer;width:22px;height:8px;border-radius:2px;background:var(--line)}
.lv button.on{background:var(--olive)}
.lv button:focus-visible{outline:2px solid var(--copper)}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px;border-bottom:1px solid var(--line2)}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.chart .c i{display:block;width:100%;max-width:38px;background:var(--copper);border-radius:2px 2px 0 0;min-height:2px}
.chart .c i.cur{background:var(--bordeaux)}
.chart .c span{font-size:.68rem;color:var(--muted);white-space:nowrap}
.chart-l{display:flex;gap:8px}
.chart-l span{flex:1;text-align:center;font-size:.68rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.photo-grid figure{margin:0;display:flex;flex-direction:column;gap:6px}
.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;background:var(--line)}
.wiz-steps{display:flex;gap:4px}
.wiz-steps i{flex:1;height:4px;background:var(--line);border-radius:2px}
.wiz-steps i.on{background:var(--copper)}
.hide-sm{}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

@media (max-width: 1080px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
